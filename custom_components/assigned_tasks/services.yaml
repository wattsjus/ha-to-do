  name: Create task
  description: Create and assign a task.
  fields:
    list_id:
      required: true
      selector:
        text:
    title:
      required: true
      selector:
        text:
    assignees:
      required: true
      selector:
        object:
    description:
      selector:
        text:
          multiline: true
    completion_mode:
      default: each_assignee
      selector:
        select:
          options:
            - label: Each person completes their own
