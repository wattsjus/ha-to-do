create_list:
  name: Create list
  description: Create a task list with optional expiration and reset settings.
  fields:
    name:
      required: true
      selector:
        text:
    list_id:
      selector:
        text:
    expires_at:
      selector:
        datetime:
    resets_at:
      selector:
        datetime:
    reset_interval:
      selector:
        select:
          options:
            - none
            - daily
            - weekly
            - monthly
            - yearly
    reset_every:
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
    visible_to:
      selector:
        object:
    notify_before_minutes:
      selector:
        number:
          min: 1
          max: 10080
          mode: box

